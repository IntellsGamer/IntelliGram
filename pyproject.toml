[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligram"
version = "0.1.0"
description = "Self-hosted Python messaging server with an MTProto-compatible implementation track."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.52,<1",
  "cryptography>=50,<51",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.28,<1"]

[project.scripts]
intelligram = "intelligram.__main__:main"
intelligram-mtproto = "intelligram.mtproto.gateway:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
